buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 7.4.2 ships R8 4.0.52, whose D8 throws NPE on the MethodParameters attribute that
        // libadb-android and spake2-android carry on their enums. Newer R8 handles it.
        classpath 'com.android.tools:r8:8.2.47'
    }
}

plugins {
    id 'com.android.application' version '7.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
